---
- name: Create config backup directory
  ansible.builtin.file:
    path: /data/config_backups
    state: directory
    owner: teamwire
    group: teamwire
    mode: 0750
  run_once: true

- name: Create current configuration backup directory
  ansible.builtin.file:
    path: /data/config_backups/{{ ansible_date_time.iso8601 }}
    state: directory
    owner: teamwire
    group: teamwire
    mode: 0750
  register: backup_directory
  run_once: true
  check_mode: false

- name: Backup the configuration files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ backup_directory.path }}/"
    owner: teamwire
    group: teamwire
    mode: 0750
  with_items:
    - "{{ inventory_dir }}/group_vars/all"
    - "{{ inventory_file }}"
  become: false
  run_once: true

- name: Backup SSL certificates and key
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ backup_directory.path }}/"
    owner: teamwire
    group: teamwire
    mode: 0644
  with_items:
    - "{{ ssl_certfile }}"
    - "{{ ssl_keyfile }}"
  when: ssl_certfile is defined and ssl_keyfile is defined
  become: false
  run_once: true

- name: Backup SSL certificates and key (OSCP style)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ backup_directory.path }}/"
    owner: teamwire
    group: teamwire
    mode: 0644
  with_items:
    - "{{ ssl_server_certificate }}"
    - "{{ ssl_intermediate_certificate }}"
    - "{{ ssl_root_certificate }}"
    - "{{ ssl_keyfile }}"
  when:
    - ssl_server_certificate is defined
    - ssl_intermediate_certificate is defined
    - ssl_root_certificate is defined
    - ssl_keyfile is defined
  become: false
  run_once: true

- name: Backup APNS certificate
  ansible.builtin.copy:
    src: "{{ apns_certificate }}"
    dest: "{{ backup_directory.path }}/"
    owner: teamwire
    group: teamwire
    mode: 0644
  when: apns_certificate is defined
  become: false
  run_once: true

- name: Backup secondary APNS certificate
  ansible.builtin.copy:
    src: "{{ apns_certificate_2 }}"
    dest: "{{ backup_directory.path }}/"
    owner: teamwire
    group: teamwire
    mode: 0644
  when: apns_certificate_2 is defined
  become: false
  run_once: true

- name: Backup third APNS certificate
  ansible.builtin.copy:
    src: "{{ apns_certificate_3 }}"
    dest: "{{ backup_directory.path }}/"
    owner: teamwire
    group: teamwire
    mode: 0644
  when: apns_certificate_3 is defined
  become: false
  run_once: true

- name: Find archived Ansible log files from previous runs
  ansible.builtin.find:
    paths: "{{ inventory_dir }}"
    patterns: "ansible-*.log"
  register: archived_log_files
  run_once: true

- name: Backup archived Ansible log files
  ansible.builtin.command: mv "{{ item.path }}" "{{ backup_directory.path }}/"
  loop: "{{ archived_log_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: tw_dev_mode is undefined or tw_dev_mode | lower != "true"
  run_once: true
