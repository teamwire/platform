---
# /data/proxysql/tw-proxysql.nomad (unlike the .cnf files, still written to
# shared storage - see "Write ProxySQL nomad job" below) reliably signals
# "ProxySQL has already been deployed once by the management play", which
# runs after this one - not whether the current config is up to date.
- name: Check if ProxySQL was already deployed
  ansible.builtin.stat:
    path: /data/proxysql/tw-proxysql.nomad
  register: proxysql_conf_status
  run_once: true

- name: Write ProxySQL Configs if config Exists
  block:

    - name: Register docker registry
      ansible.builtin.set_fact:
        local_registry: "{{ groups['docker_registry'] | sort | first }}:5000/"
      when:
        - config_done is defined
        - groups.docker_registry is defined

    - name: Create the host-local ProxySQL config directory
      ansible.builtin.file:
        path: /etc/proxysql
        owner: root
        group: root
        mode: 0755
        state: directory

    - name: Write ProxySQL config files
      ansible.builtin.template:
        src: "{{ inventory_dir }}/roles/mysqlproxy/templates/{{ item.src }}"
        dest: "/etc/proxysql/{{ item.dest }}"
        owner: teamwire
        group: root
        mode: 0644
      loop: "{{ [{'src': 'proxysql.cnf.j2', 'dest': 'proxysql.cnf'}] +
             ([{'src': 'proxysql_manager.cnf.j2', 'dest': 'proxysql_manager.cnf'}]
             if inventory_hostname in groups['management_servers'] else []) }}"
      register: proxysql_cnf_write

    - name: Write ProxySQL nomad job
      ansible.builtin.template:
        src: "{{ inventory_dir }}/roles/mysqlproxy/templates/tw-proxysql.nomad.j2"
        dest: /data/proxysql/tw-proxysql.nomad
        owner: teamwire
        group: root
        mode: 0644
      run_once: true

    - name: Determine ProxySQL container name
      ansible.builtin.shell: |
        docker ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep 'proxysql' | head -n1
      register: detected_container
      changed_when: false

    - name: Execute SQL commands in the ProxySQL container
      throttle: 1
      community.docker.docker_container_exec:
        container: "{{ detected_container.stdout | trim }}"
        command: >
          mysql -u admin -h 127.0.0.1 -P 6032 -p"{{ mysql_maxscale_monitor_password }}" -e "
          DELETE FROM mysql_servers WHERE hostgroup_id = 20;
          LOAD MYSQL SERVERS TO RUNTIME;
          DELETE FROM mysql_query_rules;
          LOAD MYSQL QUERY RULES TO RUNTIME;
          UPDATE global_variables SET variable_value = 'false' WHERE variable_name = 'mysql-multiplexing';
          LOAD MYSQL VARIABLES TO RUNTIME;
          SELECT 1;
          SELECT * FROM stats_mysql_connection_pool;
          SAVE MYSQL SERVERS TO DISK;
          SAVE MYSQL QUERY RULES TO DISK;
          SAVE MYSQL VARIABLES TO DISK;
          "
      when: detected_container.stdout | trim != ''

    - name: Read nomad management token
      ansible.builtin.command: vault kv get -field=value secret/nomad/management_token
      register: management_token
      changed_when: false
      delegate_to: "{{ groups.hashi_servers | sort | first }}"
      when:
        - groups['all'] | length > 1
        - proxysql_cnf_write.changed

    - name: Restart teamwire-proxysql nomad job to pick up the new config
      throttle: 1
      ansible.builtin.command:
        cmd: nomad job restart -on-error=fail teamwire-proxysql
      environment:
        NOMAD_TOKEN: "{{ management_token.stdout }}"
      when:
        - groups['all'] | length > 1
        - proxysql_cnf_write.changed
  when: proxysql_conf_status.stat.exists
